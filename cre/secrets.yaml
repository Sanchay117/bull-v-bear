# Secret ids the workflow asks for → environment variables that hold them during simulation.
# LLM_API_KEY is the Anthropic key (provider "anthropic") or the OpenAI-compatible provider's key.
# COINGECKO_API_KEY is an optional CoinGecko demo key; leave the variable empty to call keyless.
secretsNames:
  LLM_API_KEY:
    - LLM_API_KEY_ENV
  COINGECKO_API_KEY:
    - COINGECKO_API_KEY_ENV
