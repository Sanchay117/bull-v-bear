# The autonomous docket. Every three hours the court convenes on its own: the Chainlink CRE workflow
# runs in the CRE CLI simulator, reads the docket and the Chainlink Data Feed, hears AI counsel, rules,
# and files the DON-signed report to CourtRecord on Sepolia (--broadcast). The transcript behind the
# on-chain hash is committed to docket/ so anyone can re-verify it.
#
# Repository secrets: CRE_API_KEY (app.chain.link > Account Settings), CRE_ETH_PRIVATE_KEY (a funded
# Sepolia key), LLM_API_KEY (the workflow's LLM; Groq in config.staging.json), and optionally
# COINGECKO_API_KEY (a free demo key; shared runner IPs are rate-limited without one).

name: Docket

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docket

jobs:
  convene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Install workflow dependencies
        working-directory: cre/bull-v-bear
        run: bun install --frozen-lockfile

      - name: Install the CRE CLI
        run: |
          curl -sSL https://app.chain.link/cre/install.sh | bash
          echo "$HOME/.cre/bin" >> "$GITHUB_PATH"

      - name: Convene the court
        id: court
        env:
          CRE_API_KEY: ${{ secrets.CRE_API_KEY }}
          CRE_ETH_PRIVATE_KEY: ${{ secrets.CRE_ETH_PRIVATE_KEY }}
          LLM_API_KEY_ENV: ${{ secrets.LLM_API_KEY }}
          COINGECKO_API_KEY_ENV: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/docket.mjs

      - name: Enter the record
        env:
          SUMMARY: ${{ steps.court.outputs.summary }}
        run: |
          git config user.name "Clerk of the Court"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docket
          git commit -m "$SUMMARY [skip render]"
          git pull --rebase
          git push
